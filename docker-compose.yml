services:
  redis:
    image: redis:7-alpine
    container_name: evaluate_redis
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: quay.io/minio/minio:latest
    container_name: evaluate_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin_evaluate}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-SuperPasswordSegura2026}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    command: server /data --console-address ":9001"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: evaluate_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: evaluate
      MYSQL_USER: evaluate_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: evaluate_litellm
    ports: ["4000:4000"]
    volumes: ["./config.yaml:/app/config.yaml"]
    # FIX REDES DOCKER: Añadido --host 0.0.0.0 para aceptar peticiones desde Windows
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0", "--num_workers", "4" ]
    env_file:
      - ./backend/.env
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  mysql_data: